# =============================================================================
# config.yaml — SATU versi untuk seluruh anggota tim.
#
# Berkas ini di-commit ke git. Kalau ada yang mengubah ambang di laptopnya
# sendiri, dataset tidak bisa digabung tanpa penjelasan. Cetak hash-nya lewat
#   uv run python -m emosi.bootstrap --verify
# dan lampirkan environment.lock.json bersama data yang kamu serahkan.
# =============================================================================

project:
  name: emosi-film-id
  seed: 42
  language: en

paths:
  # Folder sumber: berisi film + subtitle. Boleh berbeda di tiap laptop,
  # jadi path ini TIDAK dianggap bagian dari reproduksibilitas.
  raw_dir: /run/media/kesan/Data/Film
  data_dir: data
  media_dir: media
  artifacts_dir: artifacts
  # Registri film (film_id unik global). Kalau tidak ada, 00_inventory
  # membuat film_id otomatis dari nama berkas.
  films_registry: films_registry.csv

# -----------------------------------------------------------------------------
# Tahap 1 — Audisi film (00_inventory.py)
# Ambang dari protokol di proposal Bab 5.
# -----------------------------------------------------------------------------
audition:
  # Satu jendela 3 menit terbukti tidak stabil: pada About Time, face ratio
  # berkisar 0.27 sampai 0.97 tergantung posisi probe. Karena itu dipakai lima
  # jendela 60 detik dan keputusan memakai rata-ratanya.
  probe_fracs: [0.10, 0.30, 0.50, 0.70, 0.90]
  probe_window_s: 60
  fps_sample: 1.0           # frame yang diuji per detik, per jendela
  frame_width: 640          # resize untuk deteksi (bukan untuk dataset)
  frame_height: 360
  face_min_size_px: 40      # wajah lebih kecil dari ini diabaikan
  wpm_min: 80               # di bawah ini dialog terlalu sepi
  wpm_max: 160              # di atas ini dialog saling tumpang tindih
  face_ratio_min: 0.50      # di bawah ini modalitas visual tidak berguna
  snr_min_db: 15            # musik dan efek menutupi ucapan
  nonenglish_max: 0.20      # null = belum diukur (butuh fastText)
  duration_min_s: 2400      # buang cuplikan dan featurette pendek
  # Pola nama berkas yang bukan film utama. Dicocokkan case-insensitive
  # pada path lengkap (folder + nama berkas).
  exclude_patterns:
    - featurette
    - extras
    - blooper
    - deleted scenes
    - trailer
    - sample
    - interview
    - behind the scenes
    - "making of"

# -----------------------------------------------------------------------------
# Tahap 3 — Deteksi potongan gambar dan adegan anotasi (02_scenes.py)
# -----------------------------------------------------------------------------
scenes:
  # Memakai filter scdet bawaan ffmpeg, bukan PySceneDetect: satu kali dekode,
  # tanpa berkas antara, dan tidak lewat OpenCV — yang pada berkas uji gagal
  # membaca HEVC 10-bit. Pada About Time, ambang 5 menghasilkan 46 cut per
  # 3 menit, setara ContentDetector 27 yang menghasilkan 49.
  scdet_threshold: 5.0   # skala 0-100 milik scdet
  scale_width: 480       # lebar frame untuk deteksi, bukan untuk dataset
  target_s: 150          # panjang adegan yang diinginkan
  min_s: 90              # di bawah ini adegan digabung ke sebelahnya
  max_s: 240             # di atas ini selalu dipotong
  head_pad_s: 20         # mulai sebelum cue subtitle pertama (lewati logo/kredit)
  tail_pad_s: 20         # berhenti setelah cue subtitle terakhir (lewati kredit)

# -----------------------------------------------------------------------------
# Tahap 4 — Segmentasi ujaran (03_utterances.py)
# -----------------------------------------------------------------------------
utterance:
  merge_gap_s: 0.4        # jarak maksimum antarcue untuk digabung
  short_gap_s: 1.0        # jarak longgar saat ujaran masih di bawah dur_min
  dur_min_s: 2.0          # target minimum; yang lebih pendek disimpan dan dicatat
  dur_max_s: 10.0         # batas keras, klip tidak pernah lebih panjang
  pad_head_s: 0.25
  pad_tail_s: 0.35
  asr_head_tol_s: 0.35    # subtitle mulai sedikit lebih awal daripada ucapan
  asr_tail_tol_s: 0.0     # kata yang mulai setelah cue = kalimat berikutnya
  trim_overlap_max_s: 0.7 # tumpang-tindih padding yang boleh dipotong dari ekor
                          # klip sebelumnya; lebih dari ini dianggap dua orang
                          # berbicara bersamaan dan tidak dipotong
  terminal_punct: [".", "?", "!", "...", "…"]

# -----------------------------------------------------------------------------
# Tahap 2 — Transkripsi. Dipakai 01_asr.py.
# -----------------------------------------------------------------------------
asr:
  model: large-v3
  language: en
  device: auto                 # auto | cuda | cpu
  compute_type: int8_float16   # RTX 4050 6 GB: int8_float16, bukan float16
  compute_type_cpu: int8       # dipakai otomatis bila CUDA tidak tersedia
  beam_size: 5
  # VAD dimatikan. Diukur pada 5 menit pertama About Time:
  #   VAD 0.50 (default) WER 0.23 · 353 kata
  #   VAD 0.35           WER 0.19 · 382 kata
  #   tanpa VAD          WER 0.13 · 403 kata
  # VAD membuang ucapan yang berada di bawah musik — bisikan dan dialog tegang,
  # tepat materi yang dibutuhkan kelas takut. Teks karangan Whisper pada musik
  # tidak berbahaya karena teks dataset diambil dari subtitle, bukan dari ASR:
  # 03_utterances.py hanya memakai kata ASR yang jatuh di dalam cue subtitle.
  vad_filter: false
  vad_threshold: 0.35          # hanya dipakai bila vad_filter: true
  vad_min_silence_ms: 500      # hanya dipakai bila vad_filter: true
  vad_speech_pad_ms: 200
  condition_on_previous_text: false
  compression_ratio_threshold: 2.4
  no_speech_threshold: 0.6
  # Fallback suhu dibatasi sampai 0.4. Rentang penuh 0.0-1.0 memang menekan
  # pengulangan, tetapi mulai mengarang teks pada musik — tidak boleh untuk
  # data yang akan dilabeli.
  temperatures: [0.0, 0.2, 0.4]

  # Pemeriksaan sinkronisasi subtitle terhadap transkrip (01_asr.py).
  # Perbandingan dilakukan per blok 20 detik, bukan per cue: perbandingan per
  # cue menghukum kata yang melewati batas cue dan membuat WER terlihat dua
  # kali lebih buruk tanpa ada kesalahan transkripsi.
  check:
    block_s: 20.0        # panjang satu blok pembanding, detik
    max_blocks: 12       # blok yang diuji, tersebar sepanjang film
    onset_window_s: 0.75 # jendela pencarian kata terdekat dari awal cue
    pad_s: 0.5           # toleransi di tepi blok, untuk WER saja
    wer_ok: 0.30         # di bawah ini: subtitle selaras
    wer_poor: 0.55       # di atas ini: subtitle bukan untuk potongan film ini

# -----------------------------------------------------------------------------
# Tahap 5 — Screening wajah per ujaran (04_face_screen.py)
# -----------------------------------------------------------------------------
face:
  # RetinaFace untuk kotak wajah, ArcFace untuk embedding 512 dimensi.
  # bobot diunduh sekali ke ~/.insightface/models/<model_pack>.
  model_pack: buffalo_l
  det_size: 640          # sisi gambar yang dilihat detektor
  det_thresh: 0.5
  sample_fps: 2.0        # frame yang dideteksi per detik; 2 cukup untuk klip 2-10 s
  frame_width: 960       # lebar frame yang didekode (bukan 1920: hemat VRAM)
  min_face_px: 48        # wajah lebih kecil dari ini tidak dipakai
  dominance_min_ratio: 1.3  # wajah terbesar harus 30% lebih besar dari kedua
                            # agar embedding-nya dipakai; pada dua wajah sama
                            # besar embedding campuran bukan wajah siapa pun
  min_face_frames: 1
  # face_ok adalah saringan awal yang lebih ketat daripada qc.face_ratio_min:
  # dipakai untuk menandai ujaran yang wajahnya cukup jelas untuk embedding
  # aktor. Keputusan masuk dataset tetap di 05_qc.py (ambang 0,50).
  face_ratio_ok: 0.60
  # Pengelompokan aktor per film untuk split C. Ambang jarak kosinus; lebih
  # kecil = lebih ketat (lebih banyak klaster). Pada dua film pilot, 0,42
  # menghasilkan 31-32 klaster per film dan klaster terbesar hanya menampung
  # 74% ujaran berwajah; 0,55 menghasilkan 16-17 klaster dengan 84%. Untuk
  # split C lebih aman menggabung berlebih daripada memecah satu aktor jadi
  # dua klaster, karena pecahan itulah yang menimbulkan kebocoran.
  # Hasilnya tetap usulan; nama aktor diisi manual.
  cluster_threshold: 0.55
  cluster_min_utterances: 5
  device: auto           # auto | cuda | cpu

# -----------------------------------------------------------------------------
# Tahap 6 — QC kandidat (05_qc.py)
# -----------------------------------------------------------------------------
qc:
  face_ratio_min: 0.50
  snr_min_db: 15
  clip_ratio_max: 0.01
  min_words: 2

# -----------------------------------------------------------------------------
# Kelas emosi. Ditetapkan sekarang, tidak diubah setelah pelabelan dimulai.
# -----------------------------------------------------------------------------
labels:
  classes: [senang, sedih, marah, takut, netral]
  ambiguous_token: ambigu
  not_eligible_token: tidak_layak
  confidence_min: 1
  confidence_max: 5

# -----------------------------------------------------------------------------
# Tahap 8 — Seleksi berkuota (08_select.py)
# -----------------------------------------------------------------------------
selection:
  target_total: 3000
  per_class: 600
  max_film_share_per_class: 0.15   # maksimal 15% satu kelas dari satu film
  min_label_conf: 3

# -----------------------------------------------------------------------------
# Tahap 10 — Pembagian data (10_split.py)
# -----------------------------------------------------------------------------
split:
  ratios: [0.70, 0.15, 0.15]
  variants: [A_random_utterance, B_per_film, C_per_actor]
  n_seeds: 3

# -----------------------------------------------------------------------------
# Tahap 12 — Pelatihan
# -----------------------------------------------------------------------------
train:
  batch_size: 16
  epochs: 30
  early_stop_patience: 5
  lr: 1.0e-4
  optuna_trials: 15
  primary_metric: macro_f1
