[project]
name = "emosi-dataset-maker"
version = "0.1.0"
description = "Pembangun dataset emosi multimodal (wajah, suara, dialog) dari klip film berbahasa Inggris"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "pysubs2>=1.7",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
# Tahap 2: transkripsi + word timestamp
asr = [
  "faster-whisper>=1.1",
  "jiwer>=3.0",
  # ctranslate2 tidak membawa libcublas/cuDNN. Tanpa paket ini GPU tidak
  # terpakai dan faster-whisper diam-diam jatuh ke CPU (50x lebih lambat).
  "nvidia-cublas-cu12>=12.4; sys_platform == 'linux'",
  "nvidia-cudnn-cu12>=9.1; sys_platform == 'linux'",
]
# Tahap 4: screening wajah presisi (RetinaFace/ArcFace)
# insightface menarik opencv-python tanpa batas versi, dan OpenCV 5 menghapus
# cv2.CascadeClassifier yang dipakai audisi 00_inventory. Pin <5 di sini supaya
# memasang extra face tidak diam-diam merusak tahap sebelumnya.
# onnxruntime-gpu >=1.23 dibangun untuk CUDA 13; mesin tim memakai CUDA 12.6.
face = [
  "insightface>=0.7.3",
  "onnxruntime-gpu>=1.19,<1.23",
  "opencv-python>=4.10,<5",
  # CUDA runtime yang dibutuhkan provider onnxruntime. Paket cublas/cudnn saja
  # tidak cukup: tanpa cudart, nvrtc, curand, dan cufft, provider CUDA gagal
  # dimuat dan onnxruntime diam-diam memakai CPU.
  "nvidia-cuda-runtime-cu12>=12.4,<13; sys_platform == 'linux'",
  "nvidia-cuda-nvrtc-cu12>=12.4,<13; sys_platform == 'linux'",
  "nvidia-curand-cu12>=10.3,<11; sys_platform == 'linux'",
  "nvidia-cufft-cu12>=11.2,<12; sys_platform == 'linux'",
]
# Tahap 7: aplikasi pelabelan
label = ["streamlit>=1.40"]
# Tahap 8: kappa
stats = ["scikit-learn>=1.5", "statsmodels>=0.14"]
# Tahap 10-12: model dan tuning
ml = [
  "torch>=2.6",
  "torchaudio>=2.6",
  "torchvision>=0.21",
  "transformers>=4.46",
  "timm>=1.0",
  "lightning>=2.4",
  "optuna>=4.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emosi"]

[tool.uv]
package = true

# torch wajib diambil dari indeks CUDA, bukan PyPI.
# Tanpa explicit = true, uv bisa mengambil wheel CPU dan training jadi 50x lebih lambat
# tanpa pesan error apa pun.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchaudio = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
